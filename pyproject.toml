[build-system]
requires = ["setuptools>=45", "wheel", "setuptools_scm[toml]>=6.2"]
build-backend = "setuptools.build_meta"

[project]
name = "montecarlo_sim"
version = "1.0.0"
description = "Librería de simulación Monte Carlo y técnicas de muestreo avanzado"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [
    {name = "Taller 3 - Simulación Montecarlo"}
]
keywords = ["monte carlo", "simulation", "importance sampling", "rejection sampling", "statistics"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "License :: OSI Approved :: MIT License",
]
dependencies = [
    "numpy>=1.20.0",
    "scipy>=1.7.0",
]

[project.optional-dependencies]
viz = ["matplotlib>=3.3.0"]
dev = ["jupyter>=1.0.0", "notebook>=6.0.0"]

[tool.setuptools]
packages = ["montecarlo_sim"]
